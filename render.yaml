services:
  - type: web
    name: noctvpn-demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
  - type: web
    name: noctvpn-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-demo.txt
    startCommand: uvicorn demo_service.app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /v1/health
